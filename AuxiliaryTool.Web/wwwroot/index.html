<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auxiliary Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Century Gothic', 'Microsoft YaHei', sans-serif;
            background: #f9f9f9;
            color: #333;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ===== 顶部标题栏 ===== */
        .title-bar {
            height: 70px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 12px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
        }
        .title-icon {
            width: 52px; height: 55px;
            margin-right: 8px;
            background: #3a9bdc;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 24px; font-weight: bold;
        }
        .title-text {
            font-size: 20px; font-weight: bold;
            font-family: 'Century Gothic', sans-serif;
            color: #333;
        }
        .title-sub {
            margin-left: auto;
            margin-right: 20px;
            font-size: 14px;
            font-family: 'Century Gothic', sans-serif;
            color: #666;
        }
        .search-box {
            width: 225px; height: 36px;
            border: 1px solid #ddd; border-radius: 18px;
            padding: 0 16px;
            font-size: 13px;
            outline: none;
        }
        .win-btn {
            width: 46px; height: 45px;
            border: none; background: transparent;
            font-size: 20px; color: #888;
            cursor: pointer; margin-left: 4px;
            border-radius: 5px;
        }
        .win-btn:hover { background: #eee; color: #333; }

        /* ===== 左侧边栏 ===== */
        .sidebar {
            width: 217px;
            background: #fff;
            border-right: 1px solid #ddd;
            position: fixed;
            top: 70px; left: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            z-index: 99;
        }
        .avatar-section {
            text-align: center;
            margin-bottom: 20px;
        }
        .avatar {
            width: 75px; height: 75px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3a9bdc, #39c5bb);
            margin: 0 auto 8px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 28px; font-weight: bold;
        }
        .hello-text {
            font-family: 'Californian FB', serif;
            font-size: 14px;
            color: #555;
        }
        .nav-btn {
            width: 212px; height: 61px;
            margin: 3px 0;
            border: none; border-radius: 10px;
            background: #fff;
            color: #666;
            font-size: 15px; font-weight: bold;
            font-family: 'Microsoft YaHei', sans-serif;
            cursor: pointer;
            text-align: left;
            padding-left: 20px;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background: #1eaee7;
            color: #fff;
        }
        .nav-btn.active {
            background: #1eaee7;
            color: #fff;
        }

        /* ===== 内容区域 ===== */
        .content-area {
            margin-left: 217px;
            margin-top: 70px;
            height: calc(100vh - 70px);
            overflow: auto;
            padding: 0;
        }
        .view { display: none; width: 100%; height: 100%; }
        .view.active { display: block; }

        /* ===== 看板页面 ===== */
        #view-overview {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .data-panel {
            border: 1px solid #ccc;
            padding: 15px 20px;
            background: #fff;
            min-height: 331px;
        }
        .overview-title {
            font-family: 'Century Gothic', sans-serif;
            font-size: 18px;
            color: #333;
            margin-bottom: 4px;
        }
        .date-label {
            font-family: 'Century Gothic', sans-serif;
            font-size: 14px;
            color: #666;
            margin-bottom: 16px;
        }
        .info-cards {
            display: flex;
            gap: 40px;
            justify-content: center;
        }
        .info-card {
            width: 292px; height: 209px;
            border-radius: 5px;
            padding: 20px;
            color: #fff;
            position: relative;
        }
        .info-card.blue {
            background: linear-gradient(135deg, #1eaee7, #1eaee7);
        }
        .info-card.green {
            background: linear-gradient(135deg, #39c5bb, #39c5bb);
        }
        .card-title {
            font-family: 'Century Gothic', sans-serif;
            font-size: 15px; font-weight: bold;
        }
        .card-value {
            font-family: 'Century Gothic', sans-serif;
            font-size: 36px; font-weight: bold;
            margin: 16px 0 8px;
        }
        .card-sub {
            font-size: 14px;
            opacity: 0.9;
        }
        .chart-panel {
            flex: 1;
            padding: 20px;
            background: #f9f9f9;
        }
        .chart-panel canvas {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        /* ===== 随机点名页面 ===== */
        #view-random.view.active {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .random-top {
            display: flex;
            height: 494px;
        }
        .random-left {
            width: 162px;
            padding: 0;
        }
        .start-btn {
            width: 100%; height: 100%;
            border: none;
            background: #e8e8e8;
            color: #888;
            font-size: 18px; font-weight: bold;
            font-family: 'Californian FB', serif;
            cursor: pointer;
            transition: background 0.2s;
        }
        .start-btn:hover { background: #ddd; }
        .start-btn.running {
            background: #e74c3c;
            color: #fff;
        }
        .random-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
            position: relative;
        }
        .random-result {
            font-family: 'SimHei', sans-serif;
            font-size: 24px; font-weight: bold;
            color: #333;
            text-align: center;
            line-height: 1.6;
        }
        .random-right {
            width: 226px;
            background: #f5f5f5;
            border-left: 1px solid #ddd;
            padding: 12px;
            overflow-y: auto;
        }
        .random-right h4 {
            font-size: 14px; color: #666;
            margin-bottom: 10px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 6px;
        }
        .random-bottom {
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .random-bottom-inner {
            width: 80%; height: 60%;
            background: repeating-linear-gradient(
                45deg, #222, #222 10px, #333 10px, #333 20px
            );
            border-radius: 4px;
        }

        /* ===== 成绩曲线页面 ===== */
        #view-score.view.active {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .score-toolbar {
            height: 121px;
            display: flex;
            border-bottom: 1px solid #ddd;
            background: #fff;
        }
        .toolbar-left {
            width: 360px;
            padding: 15px 20px;
            border-right: 1px solid #eee;
        }
        .toolbar-title {
            font-family: 'Century Gothic', sans-serif;
            font-size: 18px; font-weight: bold;
            color: #1eaee7;
            margin-bottom: 12px;
        }
        .toolbar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .toolbar-row span {
            font-size: 13px;
            font-weight: bold;
            color: #1eaee7;
            white-space: nowrap;
        }
        .toolbar-right {
            flex: 1;
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
        }
        .toolbar-right .toolbar-row {
            margin-bottom: 4px;
        }
        .toolbar-right select {
            height: 32px;
            border: 1px solid #ccc;
            background: #f5f5f5;
            font-size: 13px;
            padding: 0 8px;
            min-width: 120px;
        }
        .toolbar-btn {
            height: 32px;
            padding: 0 16px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
        }
        .btn-purple { background: #9b59b6; }
        .btn-gray { background: #777; }
        .btn-cyan { background: #00c0c0; }
        .btn-teal { background: #39c5bb; }
        .btn-blue { background: #3a9bdc; }
        .score-chart-box {
            flex: 1;
            padding: 16px;
            background: #f9f9f9;
        }
        .score-chart-box canvas {
            background: #fff;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        /* class selector in data panel */
        .class-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .class-btn {
            padding: 8px 24px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
        }
        .class-btn.a01 { background: #1eaee7; }
        .class-btn.a02 { background: #39c5bb; opacity: 0.6; }
        .class-btn.a02.active { opacity: 1; }
    </style>
</head>
<body>
    <!-- 顶部标题栏 -->
    <div class="title-bar">
        <div class="title-icon">A</div>
        <span class="title-text">Auxiliary tool</span>
        <span class="title-sub">Wllcome To the Class</span>
        <input class="search-box" placeholder="Search Here" id="searchBox">
        <button class="win-btn">-</button>
        <button class="win-btn" onclick="window.close()">&#10005;</button>
    </div>

    <!-- 左侧边栏 -->
    <div class="sidebar">
        <div class="avatar-section">
            <div class="avatar">T</div>
            <div class="hello-text">Hello Teacher</div>
        </div>
        <button class="nav-btn active" onclick="switchView('overview')">主界面</button>
        <button class="nav-btn" onclick="switchView('random')">随机点名</button>
        <button class="nav-btn" onclick="switchView('score')">成绩曲线</button>
        <button class="nav-btn">Score Entry</button>
        <button class="nav-btn">Setting</button>
    </div>

    <!-- 内容区域 -->
    <div class="content-area">
        <!-- 看板 -->
        <div id="view-overview" class="view active">
            <div class="data-panel">
                <div class="overview-title">Data overview</div>
                <div class="date-label" id="overviewDate">--</div>
                <div class="class-selector">
                    <button class="class-btn a01" id="btnA01" onclick="switchClass(1)">Select the current class as A01</button>
                    <button class="class-btn a02" id="btnA02" onclick="switchClass(2)">Select the current class as A02</button>
                </div>
                <div class="info-cards">
                    <div class="info-card blue">
                        <div class="card-title">A01 Data Length</div>
                        <div class="card-value" id="a01Count">--</div>
                        <div class="card-sub" id="a01Sub">--</div>
                    </div>
                    <div class="info-card green">
                        <div class="card-title">A02 Data Length</div>
                        <div class="card-value" id="a02Count">--</div>
                        <div class="card-sub" id="a02Sub">--</div>
                    </div>
                </div>
            </div>
            <div class="chart-panel">
                <canvas id="overviewChart"></canvas>
            </div>
        </div>

        <!-- 随机点名 -->
        <div id="view-random" class="view">
            <div class="random-top">
                <div class="random-left">
                    <button class="start-btn" id="startRandomBtn" onclick="toggleRandom()">Start Random</button>
                </div>
                <div class="random-center">
                    <div class="random-result" id="randomResult">Hi~ o(*&#65533;▽&#65533;*)ブ<br>你准备好了吗？</div>
                </div>
                <div class="random-right">
                    <h4>历史记录</h4>
                    <div id="randomHistory"></div>
                </div>
            </div>
            <div class="random-bottom">
                <div class="random-bottom-inner"></div>
            </div>
        </div>

        <!-- 成绩曲线 -->
        <div id="view-score" class="view">
            <div class="score-toolbar">
                <div class="toolbar-left">
                    <div class="toolbar-title">Data Filtering</div>
                    <div class="toolbar-row">
                        <span>单次数据长度:</span>
                        <select id="displayCount" onchange="onDisplayCountChange()">
                            <option>All</option>
                            <option>4</option>
                            <option>5</option>
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>
                            <option>9</option>
                            <option>10</option>
                        </select>
                    </div>
                </div>
                <div class="toolbar-right">
                    <div class="toolbar-row">
                        <span>直接选择：</span>
                        <select id="studentSelect" onchange="onStudentSelect()">
                            <option value="">选择学生</option>
                        </select>
                    </div>
                    <div class="toolbar-row">
                        <button class="toolbar-btn btn-purple" onclick="nextGroup()">下一组数据</button>
                        <button class="toolbar-btn btn-gray" onclick="clearChart()">清空图表</button>
                        <button class="toolbar-btn btn-cyan" id="lastWeekBtn" onclick="toggleLastWeek()">最近7次成绩</button>
                    </div>
                    <div class="toolbar-row">
                        <button class="toolbar-btn btn-teal" onclick="switchScoreMode(false)">非全分[客观分]</button>
                        <button class="toolbar-btn btn-blue" onclick="switchScoreMode(true)">全分[主客观分]</button>
                    </div>
                </div>
            </div>
            <div class="score-chart-box">
                <canvas id="scoreChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let currentClass = 1;
        let currentView = 'overview';
        let randomTimer = null;
        let randomRunning = false;
        let scoreData = { dates: [], students: [] };
        let overviewChart = null;
        let scoreChart = null;
        let isLastWeek = false;
        let displayLength = 0;
        let displayIndex = 0;
        let fullScoreMode = false;
        let originalDatasets = [];
        let allStudents = [];

        // ===== Navigation =====
        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.nav-btn').forEach((b, i) => {
                b.classList.toggle('active', i === ['overview','random','score'].indexOf(view));
            });
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            const el = document.getElementById('view-' + view);
            if (el) el.classList.add('active');
            refreshCurrentView();
        }

        function refreshCurrentView() {
            if (currentView === 'overview') loadOverview();
            if (currentView === 'random') loadRandom();
            if (currentView === 'score') loadScore();
        }

        function switchClass(id) {
            currentClass = id;
            document.getElementById('btnA01').style.opacity = id === 1 ? '1' : '0.6';
            document.getElementById('btnA02').style.opacity = id === 2 ? '1' : '0.6';
            refreshCurrentView();
        }

        // ===== Overview =====
        async function loadOverview() {
            const res = await fetch('/api/overview');
            const data = await res.json();
            document.getElementById('a01Count').textContent = data.a01.count;
            document.getElementById('a01Sub').textContent = '平均分: ' + data.a01.avg.toFixed(2);
            document.getElementById('a02Count').textContent = data.a02.count;
            document.getElementById('a02Sub').textContent = '平均分: ' + data.a02.avg.toFixed(2);
            document.getElementById('overviewDate').textContent = data.dates.length > 0 ? data.dates[data.dates.length - 1] : '--';
            renderOverviewChart(data);
        }

        function renderOverviewChart(data) {
            const ctx = document.getElementById('overviewChart').getContext('2d');
            if (overviewChart) overviewChart.destroy();
            overviewChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.dates,
                    datasets: [{
                        label: 'A01 平均分',
                        data: data.averages1 || [],
                        borderColor: '#1eaee7',
                        backgroundColor: 'rgba(30,174,231,0.1)',
                        tension: 0.3,
                        fill: true
                    }, {
                        label: 'A02 平均分',
                        data: data.averages2 || [],
                        borderColor: '#39c5bb',
                        backgroundColor: 'rgba(57,197,187,0.1)',
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: {
                        y: { beginAtZero: false, min: 0, max: 1 }
                    }
                }
            });
        }

        // ===== Random =====
        async function loadRandom() {
            const res = await fetch('/api/class/' + currentClass);
            allStudents = await res.json();
        }

        function toggleRandom() {
            const btn = document.getElementById('startRandomBtn');
            const result = document.getElementById('randomResult');
            if (!randomRunning) {
                randomRunning = true;
                btn.textContent = 'Stop';
                btn.classList.add('running');
                randomTimer = setInterval(() => {
                    if (allStudents.length > 0) {
                        const idx = Math.floor(Math.random() * allStudents.length);
                        result.innerHTML = '<span style="color:' + randomColor() + ';font-size:36px;">' + allStudents[idx].name + '</span>';
                    }
                }, 60);
            } else {
                randomRunning = false;
                btn.textContent = 'Start Random';
                btn.classList.remove('running');
                clearInterval(randomTimer);
                doRandom();
            }
        }

        async function doRandom() {
            const res = await fetch('/api/random/' + currentClass, { method: 'POST' });
            const data = await res.json();
            document.getElementById('randomResult').innerHTML = '<span style="color:#333;font-size:36px;">' + data.name + '</span><div style="font-size:16px;color:#666;margin-top:8px;">[' + data.callCount + ']</div>';
            const item = document.createElement('div');
            item.style.cssText = 'padding:6px 0;font-size:15px;border-bottom:1px solid #ddd;color:' + randomColor() + ';';
            item.textContent = data.name + '  [' + data.callCount + ']';
            document.getElementById('randomHistory').insertBefore(item, document.getElementById('randomHistory').firstChild);
        }

        function randomColor() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            return 'rgb(' + r + ',' + g + ',' + b + ')';
        }

        // ===== Score =====
        async function loadScore() {
            const res = await fetch('/api/scores/' + currentClass + '?fullScore=' + fullScoreMode);
            scoreData = await res.json();
            displayIndex = 0;
            isLastWeek = false;
            document.getElementById('lastWeekBtn').textContent = '最近7次成绩';

            const sel = document.getElementById('studentSelect');
            sel.innerHTML = '<option value="">选择学生</option>';
            scoreData.students.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.name;
                opt.textContent = s.name;
                sel.appendChild(opt);
            });

            firstChart();
        }

        function firstChart() {
            const count = Math.min(Math.floor(Math.random() * 4) + 3, scoreData.students.length);
            const used = new Set();
            const datasets = [];
            while (datasets.length < count) {
                const idx = Math.floor(Math.random() * scoreData.students.length);
                if (used.has(idx)) continue;
                used.add(idx);
                datasets.push(createDataset(scoreData.students[idx]));
            }
            originalDatasets = JSON.parse(JSON.stringify(datasets));
            displayIndex = Math.max(...Array.from(used)) + 1;
            renderScoreChart(datasets);
        }

        function createDataset(student) {
            const color = randomColor();
            return {
                label: student.name,
                data: student.scores,
                borderColor: color,
                backgroundColor: color,
                pointRadius: 3,
                tension: 0,
                fill: false
            };
        }

        function renderScoreChart(datasets) {
            const ctx = document.getElementById('scoreChart').getContext('2d');
            const labels = isLastWeek && scoreData.dates.length >= 7
                ? scoreData.dates.slice(-7)
                : scoreData.dates;

            const displayDatasets = datasets.map(ds => ({
                ...ds,
                data: isLastWeek && ds.data.length >= 7 ? ds.data.slice(-7) : ds.data
            }));

            if (scoreChart) scoreChart.destroy();
            scoreChart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets: displayDatasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right' } },
                    scales: {
                        x: { ticks: { color: '#555' }, grid: { color: '#eee' } },
                        y: { ticks: { color: '#555' }, grid: { color: '#eee' }, title: { display: true, text: 'Percentage of Score', color: '#555' } }
                    }
                }
            });
        }

        function nextGroup() {
            if (displayLength === 0) displayLength = scoreData.students.length;
            const currentDatasets = scoreChart.data.datasets.map(ds => ({
                label: ds.label,
                data: scoreData.students.find(s => s.name === ds.label)?.scores || [],
                borderColor: ds.borderColor,
                backgroundColor: ds.backgroundColor,
                pointRadius: 3, tension: 0, fill: false
            }));
            for (let i = displayIndex; i < displayIndex + displayLength; i++) {
                if (i >= scoreData.students.length) break;
                const stu = scoreData.students[i];
                if (currentDatasets.find(ds => ds.label === stu.name)) continue;
                currentDatasets.push(createDataset(stu));
            }
            displayIndex += displayLength;
            if (displayIndex >= scoreData.students.length) displayIndex = 0;
            originalDatasets = JSON.parse(JSON.stringify(currentDatasets));
            renderScoreChart(currentDatasets);
        }

        function clearChart() {
            if (scoreChart) {
                scoreChart.data.datasets = [];
                scoreChart.update();
            }
            originalDatasets = [];
            document.getElementById('studentSelect').value = '';
        }

        function toggleLastWeek() {
            isLastWeek = !isLastWeek;
            document.getElementById('lastWeekBtn').textContent = isLastWeek ? '全部' : '最近7次成绩';
            renderScoreChart(originalDatasets);
        }

        function onDisplayCountChange() {
            const val = document.getElementById('displayCount').value;
            displayLength = val === 'All' ? scoreData.students.length : parseInt(val);
            displayIndex = 0;
        }

        function onStudentSelect() {
            const name = document.getElementById('studentSelect').value;
            if (!name) return;
            const current = scoreChart.data.datasets;
            if (current.find(ds => ds.label === name)) return;
            const stu = scoreData.students.find(s => s.name === name);
            if (!stu) return;
            const newDatasets = [...current.map(ds => ({
                label: ds.label,
                data: scoreData.students.find(s => s.name === ds.label)?.scores || [],
                borderColor: ds.borderColor,
                backgroundColor: ds.backgroundColor,
                pointRadius: 3, tension: 0, fill: false
            })), createDataset(stu)];
            originalDatasets = JSON.parse(JSON.stringify(newDatasets));
            renderScoreChart(newDatasets);
        }

        function switchScoreMode(full) {
            fullScoreMode = full;
            loadScore();
        }

        // Init
        switchClass(1);
    </script>
</body>
</html>
